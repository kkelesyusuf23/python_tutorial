<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kilitli Not Sepeti</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #818cf8;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: var(--primary);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .link {
            color: #818cf8;
            cursor: pointer;
            font-size: 14px;
            margin-top: 15px;
            display: block;
        }
        .link:hover {
            text-decoration: underline;
        }
        #message {
            margin-top: 15px;
            font-size: 14px;
            color: #f87171;
        }
        
        /* Dashboard Stilleri */
        .note-card {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
        }
        .note-title {
            font-weight: 700;
            color: #818cf8;
        }
        .note-content {
            font-size: 14px;
            color: #cbd5e1;
            margin-top: 5px;
        }
        
        /* Sayfa Geçişleri */
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- 1. GİRİŞ EKRANI -->
    <div id="login-screen" class="container">
        <h2>🔒 Kilitli Not Sepeti</h2>
        <input type="text" id="login-user" placeholder="Kullanıcı Adı" autocomplete="off">
        <input type="password" id="login-pass" placeholder="Şifre">
        <button onclick="girisYap()">Giriş Yap</button>
        <span class="link" onclick="ekranDegistir('register-screen')">Hesabın yok mu? Kayıt Ol</span>
        <div id="login-msg" id="message"></div>
    </div>

    <!-- 2. KAYIT EKRANI -->
    <div id="register-screen" class="container hidden">
        <h2>✍️ Kayıt Ol</h2>
        <input type="text" id="reg-user" placeholder="Yeni Kullanıcı Adı" autocomplete="off">
        <input type="password" id="reg-pass" placeholder="Yeni Şifre">
        <button onclick="kayitOl()">Kayıt İşlemini Tamamla</button>
        <span class="link" onclick="ekranDegistir('login-screen')">Geri Dön</span>
        <div id="reg-msg" id="message"></div>
    </div>

    <!-- 3. GİZLİ NOTLAR (DASHBOARD) EKRANI -->
    <div id="dashboard-screen" class="container hidden">
        <h2>📝 Gizli Notlarım</h2>
        
        <input type="text" id="new-note-title" placeholder="Yeni notunuz..." autocomplete="off">
        <button onclick="notEkle()">Notu Ekle</button>
        
        <div id="notes-list">
            <!-- Notlar buraya JS ile eklenecek -->
        </div>
        
        <button onclick="cikisYap()" style="background-color: #ef4444; margin-top: 30px;">Çıkış Yap</button>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        // Ekranları değiştirme fonksiyonu
        function ekranDegistir(ekranId) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('register-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById(ekranId).classList.remove('hidden');
            
            document.getElementById('login-msg').innerText = "";
            document.getElementById('reg-msg').innerText = "";
        }

        // Sayfa açıldığında daha önce giriş yapıp yapmadığını kontrol et
        window.onload = () => {
            const token = localStorage.getItem("jwt_token");
            if (token) {
                // Token varsa direkt dashboard'a git ve notları çek
                ekranDegistir("dashboard-screen");
                notlariGetir();
            }
        };

        // 1. KAYIT OL
        async function kayitOl() {
            const user = document.getElementById("reg-user").value;
            const pass = document.getElementById("reg-pass").value;
            
            if(!user || !pass) return alert("Boş bırakmayın!");

            const response = await fetch(API_URL + "/kayit", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ kullanici_adi: user, sifre: pass })
            });
            const data = await response.json();
            
            if(response.ok) {
                document.getElementById("reg-msg").style.color = "#4ade80";
                document.getElementById("reg-msg").innerText = "Başarılı! Giriş yapabilirsiniz.";
            } else {
                document.getElementById("reg-msg").style.color = "#f87171";
                document.getElementById("reg-msg").innerText = data.detail;
            }
        }

        // 2. GİRİŞ YAP (TOKEN AL)
        async function girisYap() {
            const user = document.getElementById("login-user").value;
            const pass = document.getElementById("login-pass").value;

            if(!user || !pass) return alert("Boş bırakmayın!");

            // FastAPI'nin OAuth2 sistemi, JSON yerine Form verisi (URL Encoded) bekler
            const formData = new URLSearchParams();
            formData.append("username", user);
            formData.append("password", pass);

            const response = await fetch(API_URL + "/giris", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData.toString()
            });
            const data = await response.json();

            if(response.ok) {
                // KRİTİK NOKTA: Gelen "Token"ı tarayıcının yerel hafızasına (localStorage) kaydediyoruz!
                localStorage.setItem("jwt_token", data.access_token);
                
                // Dashboard'a geç ve notları çek
                ekranDegistir("dashboard-screen");
                notlariGetir();
            } else {
                document.getElementById("login-msg").innerText = "Hatalı kullanıcı adı veya şifre!";
            }
        }

        // 3. KORUMALI VERİYİ ÇEK (TOKEN GÖSTER)
        async function notlariGetir() {
            const token = localStorage.getItem("jwt_token");
            if(!token) {
                cikisYap();
                return;
            }

            // KRİTİK NOKTA 2: İstek atarken "Authorization: Bearer <token>" başlığını ekliyoruz.
            // Bu JWT mantığının kalbidir.
            const response = await fetch(API_URL + "/notlar", {
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if(response.ok) {
                const notlar = await response.json();
                const container = document.getElementById("notes-list");
                container.innerHTML = "";
                
                if(notlar.length === 0) {
                    container.innerHTML = "<p style='color: #94a3b8; font-style: italic; margin-top:20px;'>Henüz notunuz yok.</p>";
                }
                
                notlar.forEach(not => {
                    container.innerHTML += `
                        <div class="note-card">
                            <div class="note-title">${not.baslik}</div>
                            <div class="note-content">${not.icerik}</div>
                        </div>
                    `;
                });
            } else {
                // Token geçersizse veya süresi dolmuşsa çıkış yap
                alert("Oturum süreniz doldu, lütfen tekrar giriş yapın.");
                cikisYap();
            }
        }

        // 4. KORUMALI VERİ EKLE
        async function notEkle() {
            const baslik = document.getElementById("new-note-title").value;
            const token = localStorage.getItem("jwt_token");
            
            if(!baslik || !token) return;

            const response = await fetch(API_URL + "/notlar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token // Bilet olmadan giremeyiz!
                },
                body: JSON.stringify({ baslik: baslik, icerik: "Tarayıcıdan eklendi." })
            });

            if(response.ok) {
                document.getElementById("new-note-title").value = "";
                notlariGetir(); // Listeyi güncelle
            } else {
                alert("Not eklenirken hata oluştu.");
            }
        }

        // 5. ÇIKIŞ YAP (TOKEN YIRTILIR)
        function cikisYap() {
            // Bileti çöpe atıyoruz
            localStorage.removeItem("jwt_token");
            
            document.getElementById("login-user").value = "";
            document.getElementById("login-pass").value = "";
            
            ekranDegistir("login-screen");
        }
    </script>
</body>
</html>

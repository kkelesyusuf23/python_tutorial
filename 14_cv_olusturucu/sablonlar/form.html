<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sihirli CV Oluşturucu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #f1f5f9; 
            display: flex; 
            justify-content: center; 
            padding: 40px;
            color: #334155;
        }
        .form-container { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            width: 500px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        }
        h2 { text-align: center; color: #3b82f6; margin-top: 0; }
        label { font-weight: 600; font-size: 14px; margin-bottom: 5px; display: block; }
        input, textarea { 
            width: 100%; 
            margin-bottom: 20px; 
            padding: 12px; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-family: 'Outfit', sans-serif;
        }
        textarea { height: 100px; resize: vertical; }
        button { 
            width: 100%; 
            padding: 15px; 
            background: #3b82f6; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s;
        }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>✨ CV Oluşturucu</h2>
        <p style="text-align: center; font-size: 14px; color: #64748b; margin-bottom: 30px;">
            Bilgilerinizi girin, harika tasarımınızı saniyeler içinde PDF olarak indirin!
        </p>
        
        <form action="/cv-olustur" method="POST">
            <label>Ad ve Soyad</label>
            <input type="text" name="ad_soyad" placeholder="Örn: Yusuf Keleş" required>
            
            <label>Meslek / Ünvan</label>
            <input type="text" name="meslek" placeholder="Örn: Senior Backend Developer" required>
            
            <label>Telefon Numarası</label>
            <input type="text" name="telefon" placeholder="Örn: +90 555 555 5555" required>
            
            <label>E-Posta Adresi</label>
            <input type="email" name="eposta" placeholder="Örn: yusuf@mail.com" required>
            
            <label>Hakkımda</label>
            <textarea name="hakkimda" placeholder="Kısaca kendinizden bahsedin..." required></textarea>
            
            <label>İş Deneyimleri</label>
            <textarea name="deneyim" placeholder="Eski şirketleriniz ve rolleriniz..." required></textarea>
            
            <label>Eğitim Bilgileri</label>
            <textarea name="egitim" placeholder="Okuduğunuz okullar ve bölümler..." required></textarea>
            
            <button type="submit">PDF Olarak İndir</button>
        </form>
    </div>
</body>
</html>

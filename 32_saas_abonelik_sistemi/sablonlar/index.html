<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>SaaS Abonelik Planı</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        .fiyat-karti { background: #1e293b; padding: 40px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; max-width: 350px; border: 2px solid #6366f1; position: relative; overflow: hidden; }
        
        .tavsiye-etiketi { background: #6366f1; color: white; font-size: 12px; font-weight: 800; padding: 5px 30px; position: absolute; top: 15px; right: -30px; transform: rotate(45deg); }
        
        .kutu-baslik { font-size: 24px; color: #94a3b8; font-weight: 600; margin-bottom: 10px; }
        .fiyat { font-size: 48px; font-weight: 800; color: white; margin: 0; }
        .fiyat span { font-size: 18px; color: #64748b; font-weight: 400; }
        
        .ozellikler { text-align: left; margin: 30px 0; padding: 0; list-style: none; }
        .ozellikler li { margin-bottom: 15px; font-size: 15px; color: #cbd5e1; display: flex; align-items: center; gap: 10px; }
        .ozellikler li::before { content: '✓'; color: #10b981; font-weight: 800; font-size: 18px; }
        
        .satin-al-btn { background: #6366f1; color: white; border: none; padding: 15px; font-size: 18px; font-weight: 800; border-radius: 10px; cursor: pointer; transition: 0.2s; width: 100%; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4); }
        .satin-al-btn:hover { background: #4f46e5; transform: translateY(-3px); }
    </style>
</head>
<body>

    <div class="fiyat-karti">
        <div class="tavsiye-etiketi">EN POPÜLER</div>
        
        <div class="kutu-baslik">PRO ABONELİK</div>
        <div class="fiyat">$19<span>/ay</span></div>
        
        <ul class="ozellikler">
            <li>Tüm Premium özelliklere erişim</li>
            <li>Reklamsız deneyim (Sınırsız)</li>
            <li>7/24 Öncelikli Canlı Destek</li>
            <li>Erken beta erişimi</li>
        </ul>
        
        <!-- Butona basınca main.py'deki /odeme-baslat rotası tetiklenecek -->
        <form action="/odeme-baslat" method="POST">
            <button type="submit" class="satin-al-btn">💳 Stripe ile Öde</button>
        </form>
    </div>

</body>
</html>

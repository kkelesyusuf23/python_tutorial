<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toplu E-Posta Servisi</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            text-align: center;
        }
        label {
            display: block;
            margin: 15px 0 5px;
            color: #94a3b8;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #0284c7;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>✉️ Toplu Mail Gönderici</h2>
        <p style="text-align:center; color:#94a3b8; font-size:14px;">Asenkron (Background Task) Testi</p>
        
        <form action="/gonder" method="POST">
            <label>Alıcı E-Posta Adresleri (Virgülle ayırın):</label>
            <input type="text" name="alicilar" placeholder="ahmet@mail.com, mehmet@mail.com" required>
            
            <label>Mail İçeriği:</label>
            <textarea name="mesaj" placeholder="Merhaba, bu hafta sonu büyük indirimimiz var!" required></textarea>
            
            <button type="submit">Gönderimi Başlat (Arka Planda)</button>
        </form>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        .giris-kutu { background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; max-width: 400px; border: 1px solid #334155; }
        .giris-kutu h1 { margin-top: 0; font-size: 26px; font-weight: 800; color: #f8fafc; }
        .giris-kutu p { color: #94a3b8; font-size: 15px; margin-bottom: 30px; line-height: 1.6; }
        
        /* GitHub Butonu */
        .github-btn { background: #24292e; color: white; border: 1px solid #1b1f23; padding: 15px 25px; font-size: 18px; font-weight: 800; border-radius: 8px; cursor: pointer; transition: 0.2s; font-family: 'Outfit'; display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; text-decoration: none; box-sizing: border-box; }
        .github-btn:hover { background: #1b1f23; transform: translateY(-2px); }
        .github-btn svg { width: 24px; height: 24px; fill: white; }
    </style>
</head>
<body>

    <div class="giris-kutu">
        <h1>Antigravity SSO'ya Hoşgeldin</h1>
        <p>E-Ticaret sitenize, forumunuza veya uygulamanıza kayıt olurken kullanıcıdan "Şifre" istemek yerine, dünyanın en güvenli giriş yöntemini kullanın.</p>
        
        <a href="/login" class="github-btn">

            GitHub ile Giriş Yap
        </a>
    </div>

</body>
</html>

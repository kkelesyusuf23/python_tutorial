<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>QR Menü Yönetim Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #f1f5f9; color: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        h2 { color: #2563eb; margin-top: 0;}
        input { width: 100%; padding: 15px; margin-top: 20px; border-radius: 8px; border: 2px solid #e2e8f0; font-size: 16px; box-sizing: border-box; text-align: center;}
        button { width: 100%; padding: 15px; margin-top: 20px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s;}
        button:hover { background: #1d4ed8; }
        .qr-kutusu { margin-top: 30px; padding-top: 20px; border-top: 2px dashed #e2e8f0; }
        .qr-kutusu img { max-width: 200px; border-radius: 10px; border: 4px solid #2563eb; padding: 10px;}
        .link { font-size: 13px; color: #64748b; word-break: break-all; margin-top: 10px;}
    </style>
</head>
<body>

    <div class="card">
        <h2>🛠️ QR Menü Yöneticisi</h2>
        <p style="color: #64748b; font-size: 14px;">Restoranınızdaki bir masa için QR Kod oluşturun.</p>
        
        <form action="/qr-uret" method="POST">
            <input type="text" name="masa_no" placeholder="Örn: 5" required>
            <button type="submit">QR Kod Üret</button>
        </form>

        {% if qr_resim %}
        <div class="qr-kutusu">
            <h3 style="margin-bottom: 10px;">Masa {{ masa_no }} Karekodu</h3>
            <img src="{{ qr_resim }}" alt="QR Kod">
            <div class="link">Hedef Link:<br> <b>{{ hedef_link }}</b></div>
        </div>
        {% endif %}
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Süper İndirici</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #0f172a; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #f8fafc;
        }
        .form-container { 
            background: #1e293b; 
            padding: 40px; 
            border-radius: 12px; 
            width: 500px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            border: 1px solid #334155;
            text-align: center;
        }
        h2 { 
            color: #ef4444; /* YouTube kırmızısı */
            margin-top: 0; 
            font-size: 32px;
        }
        input { 
            width: 100%; 
            margin-top: 20px;
            margin-bottom: 20px; 
            padding: 15px; 
            border: 1px solid #475569; 
            background-color: #0f172a;
            color: white;
            border-radius: 6px; 
            box-sizing: border-box; 
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
        }
        button { 
            width: 100%; 
            padding: 15px; 
            background: #ef4444; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s;
        }
        button:hover { background: #dc2626; }
        .loading-text {
            display: none;
            color: #94a3b8;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>🎥 Süper İndirici</h2>
        <p style="color: #94a3b8; font-size: 15px;">Herhangi bir YouTube linkini yapıştırın ve arkanıza yaslanın.</p>
        
        <form action="/indir" method="POST" onsubmit="document.getElementById('loading').style.display='block';">
            <input type="url" name="link" placeholder="Örn: https://www.youtube.com/watch?v=..." required>
            <button type="submit">Hemen İndir</button>
        </form>

        <div id="loading" class="loading-text">
            ⏳ Video sunucuya çekiliyor, boyutuna göre biraz sürebilir...
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Anket Sonuçları</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Chart.js (Grafik Kütüphanesi) entegrasyonu -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Outfit', sans-serif; background: #f3f4f6; color: #1f2937; margin: 0; padding: 40px; }
        .kutu { background: white; padding: 30px; border-radius: 12px; max-width: 800px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #4f46e5; text-align: center; margin-top: 0; border-bottom: 2px solid #e5e7eb; padding-bottom: 15px;}
        .bilgi { text-align: center; color: #6b7280; font-size: 16px; margin-bottom: 30px;}
        
        .grafik-alani { display: flex; flex-direction: column; align-items: center; margin-bottom: 40px; border: 1px solid #e5e7eb; padding: 20px; border-radius: 12px;}
        .soru-baslik { font-size: 20px; font-weight: 800; margin-bottom: 20px; text-align: center;}
        
        .canvas-container { width: 300px; height: 300px; }
        .btn-geri { display: block; text-align: center; background: #4f46e5; color: white; text-decoration: none; padding: 15px; border-radius: 8px; font-weight: bold; margin-top: 20px;}
    </style>
</head>
<body>
    <div class="kutu">
        <h1>📊 {{ anket.baslik }} - Sonuçlar</h1>
        <div class="bilgi">Bu ankete bugüne kadar toplam <strong>{{ toplam_oy }}</strong> kişi katıldı.</div>

        <!-- Anketin tüm sorularını döngüye sok -->
        {% for soru in anket.sorular %}
        {% set s_index = loop.index0 %}
        <div class="grafik-alani">
            <div class="soru-baslik">{{ loop.index }}. {{ soru.soru }}</div>
            
            <div class="canvas-container">
                <!-- Javascript bu id'yi kullanarak buraya bir grafik çizecek (Örn: chart_0) -->
                <canvas id="chart_{{ s_index }}"></canvas>
            </div>
            
            <script>
                // Sayfa yüklenirken bu script bloğu her soru için ayrı ayrı çalışır
                (function() {
                    // Python (Jinja) içindeki istatistik sözlüğünü Javascript JSON nesnesine aktar
                    const veri = {{ istatistik[s_index|string] | tojson }};
                    
                    const etiketler = Object.keys(veri); // Şıklar (Örn: Mavi, Kırmızı)
                    const oylar = Object.values(veri);   // Oy Sayıları (Örn: 5, 2)
                    
                    // Grafiği çiz!
                    const ctx = document.getElementById('chart_{{ s_index }}').getContext('2d');
                    new Chart(ctx, {
                        type: 'doughnut', // Simit Pasta Grafiği
                        data: {
                            labels: etiketler,
                            datasets: [{
                                data: oylar,
                                backgroundColor: ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899']
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { position: 'bottom' }
                            }
                        }
                    });
                })();
            </script>
        </div>
        {% endfor %}
        
        <a href="/" class="btn-geri">🏠 Anasayfaya Dön</a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Anketi Çöz</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #f3f4f6; color: #1f2937; margin: 0; padding: 40px; }
        .kutu { background: white; padding: 30px; border-radius: 12px; max-width: 800px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #4f46e5; text-align: center; margin-top: 0; border-bottom: 2px solid #e5e7eb; padding-bottom: 15px;}
        .soru { font-size: 18px; font-weight: 600; margin-top: 25px; margin-bottom: 10px;}
        
        .secenek-label { display: block; padding: 15px; border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: 0.2s;}
        .secenek-label:hover { background: #f9fafb; border-color: #9ca3af;}
        input[type="radio"] { margin-right: 10px; transform: scale(1.2);}
        
        .btn-gonder { background: #10b981; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: 800; font-family: 'Outfit'; width: 100%; font-size: 18px; margin-top: 30px;}
        .btn-gonder:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="kutu">
        <h1>{{ anket.baslik }}</h1>
        <form action="/anket/{{ anket.id }}/oy-ver" method="post">
            {% for soru in anket.sorular %}
            <div class="soru">{{ loop.index }}. {{ soru.soru }}</div>
            
            {% set s_index = loop.index0 %}
            {% for secenek in soru.secenekler %}
            <label class="secenek-label">
                <!-- name özniteliğine soru_0, soru_1 gibi index veriyoruz ki Python ayrı ayrı yakalasın -->
                <input type="radio" name="soru_{{ s_index }}" value="{{ secenek }}" required>
                {{ secenek }}
            </label>
            {% endfor %}
            
            {% endfor %}
            <button type="submit" class="btn-gonder">Oylarımı Gönder</button>
        </form>
    </div>
</body>
</html>

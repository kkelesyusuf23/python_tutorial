<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı Alışveriş Listesi</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }

        body {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .app-container { width: 100%; max-width: 500px; }

        h1 {
            text-align: left;
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 20px rgba(236, 72, 153, 0.2);
        }

        /* --- KATALOG BÖLÜMÜ --- */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .catalog-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .catalog-item:hover {
            background: rgba(168, 85, 247, 0.2);
            transform: translateY(-4px);
            border-color: #a855f7;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        .catalog-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

        /* --- SEPET BÖLÜMÜ --- */
        .list-container { list-style: none; display: flex; flex-direction: column; gap: 1rem; }

        .list-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .list-item:hover { background: rgba(255, 255, 255, 0.06); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        .item-content { display: flex; align-items: center; gap: 1rem; flex: 1; }

        /* Custom Checkbox */
        .custom-checkbox {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid #a855f7;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            display: grid;
            place-content: center;
        }
        .custom-checkbox::before {
            content: ""; width: 12px; height: 12px; background: white; transform: scale(0); border-radius: 2px;
            transition: 0.2s transform ease-in-out; box-shadow: inset 1em 1em #a855f7;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .custom-checkbox:checked { background: #a855f7; }
        .custom-checkbox:checked::before { transform: scale(1.1); }

        .item-text { font-size: 1.15rem; color: #f1f5f9; transition: all 0.3s ease; }
        .item-text.completed { text-decoration: line-through; color: #64748b; }

        /* Miktar Kontrolleri (+ / -) */
        .qty-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(0,0,0,0.3);
            padding: 0.3rem;
            border-radius: 8px;
        }

        .qty-btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .qty-btn:hover { background: #a855f7; }
        .qty-text { font-weight: bold; min-width: 24px; text-align: center; font-size: 1.1rem; }

        .empty-state { text-align: center; color: #64748b; font-style: italic; margin-top: 2rem; }
    </style>
</head>
<body>
    
    <div class="app-container" x-data="alisverisApp()" x-init="baslat()">
        
        <!-- KATALOG VİTRİNİ -->
        <h1>Ürün Kataloğu</h1>
        <div class="catalog-grid">
            <template x-for="urun in katalog" :key="urun.id">
                <div class="catalog-item" @click="urunEkle(urun.adi)">
                    <div class="catalog-icon" x-text="urun.ikon"></div>
                    <div x-text="urun.adi" style="font-weight: 500; font-size: 0.95rem;"></div>
                    <div x-text="urun.fiyat + ' ₺'" style="color: #d8b4fe; font-size: 0.8rem; margin-top: 5px;"></div>
                </div>
            </template>
        </div>
        
        <hr style="border-color: rgba(255,255,255,0.1); margin-bottom: 2rem;">

        <!-- SEPET -->
        <h1>Sepetim</h1>
        
        <ul class="list-container">
            <template x-for="(urun, index) in urunlerListesi" :key="urun.id">
                <li class="list-item">
                    <div class="item-content">
                        <!-- Custom Checkbox -->
                        <input type="checkbox" class="custom-checkbox" :checked="urun.alindi_mi" @change="urunGuncelle(urun.id, index)">
                        <!-- Ürün Adı -->
                        <span class="item-text" :class="urun.alindi_mi ? 'completed' : ''" x-text="urun.urun_adi"></span>
                    </div>
                    
                    <!-- Miktar (+ / -) Kontrolleri -->
                    <div class="qty-controls">
                        <button class="qty-btn" @click="miktarDegistir(urun.id, index, 'azalt')">-</button>
                        <span class="qty-text" x-text="urun.miktar"></span>
                        <button class="qty-btn" @click="miktarDegistir(urun.id, index, 'artir')">+</button>
                    </div>
                </li>
            </template>
        </ul>

        <!-- Liste Boşsa -->
        <div class="empty-state" x-show="urunlerListesi.length === 0" style="display: none;">
            Sepetiniz boş. Yukarıdaki katalogdan ürün seçerek alışverişe başlayın!
        </div>
    </div>

    <!-- Alpine.js Arka Plan Kodlarımız -->
    <script>
        function alisverisApp() {
            return {
                katalog: [],
                urunlerListesi: [], 
                
                async baslat() {
                    // Sayfa açıldığında hem kataloğu hem sepeti çekiyoruz
                    const katCevap = await fetch('/katalog');
                    this.katalog = await katCevap.json();
                    
                    const sepCevap = await fetch('/urunler');
                    this.urunlerListesi = await sepCevap.json();
                },
                
                async urunEkle(adi) {
                    const cevap = await fetch('/urun-ekle', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ urun_adi: adi })
                    });
                    
                    const yeniVeyaGuncel = await cevap.json();
                    
                    // Ürün sepette zaten varsa miktarını güncelle, yoksa yeni ekle
                    const index = this.urunlerListesi.findIndex(u => u.id === yeniVeyaGuncel.id);
                    if (index !== -1) {
                        this.urunlerListesi[index] = yeniVeyaGuncel;
                    } else {
                        this.urunlerListesi.unshift(yeniVeyaGuncel);
                    }
                },
                
                async miktarDegistir(id, index, islem) {
                    const cevap = await fetch('/miktar-guncelle/' + id, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ islem: islem })
                    });
                    
                    const sonuc = await cevap.json();
                    
                    if (sonuc.durum === 'silindi') {
                        // Eğer miktar 0 olduysa ürünü diziden sil (ekrandan uçur)
                        this.urunlerListesi.splice(index, 1);
                    } else if (!sonuc.durum) {
                        // Miktar değiştiyse ekrandaki miktarı güncelle
                        this.urunlerListesi[index] = sonuc;
                    }
                },

                async urunGuncelle(id, index) {
                    const cevap = await fetch('/urun-guncelle/' + id, { method: 'PUT' });
                    const guncellenmisUrun = await cevap.json();
                    this.urunlerListesi[index] = guncellenmisUrun;
                }
            }
        }
    </script>
</body>
</html>

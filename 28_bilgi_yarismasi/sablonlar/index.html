<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Çok Oyunculu Bilgi Yarışması</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #4338ca; color: white; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;}
        
        /* Ekranlar arası geçiş (Durum Makinesi) */
        .ekran { display: none; width: 100%; max-width: 600px; text-align: center; padding: 20px;}
        .aktif { display: block;}
        
        /* GİRİŞ EKRANI */
        .giris-kutusu { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); color: #111827;}
        .giris-kutusu input { width: 100%; padding: 15px; border-radius: 8px; border: 2px solid #ccc; font-size: 18px; margin-bottom: 20px; box-sizing: border-box; font-family: 'Outfit'; font-weight: 600; text-align: center;}
        .giris-kutusu button { width: 100%; padding: 15px; border-radius: 8px; border: none; background: #4f46e5; color: white; font-size: 20px; font-weight: 800; cursor: pointer; transition: 0.2s; font-family: 'Outfit';}
        .giris-kutusu button:hover { background: #4338ca;}
        
        /* SORU EKRANI */
        .soru-metni { font-size: 32px; font-weight: 800; margin-bottom: 30px;}
        .sure-cubugu { width: 100%; background: #3730a3; height: 20px; border-radius: 10px; overflow: hidden; margin-bottom: 30px;}
        .sure-ici { height: 100%; background: #fbbf24; width: 100%; transition: width 1s linear;}
        
        /* Seçenek Butonları */
        .secenekler { display: grid; grid-template-columns: 1fr 1fr; gap: 15px;}
        .secenek { background: white; color: #111827; border: none; padding: 25px 20px; font-size: 18px; font-weight: 800; border-radius: 8px; cursor: pointer; transition: 0.2s; font-family: 'Outfit';}
        .secenek:hover { transform: scale(1.05);}
        .renk-0 { background: #ef4444; color: white;} /* Kırmızı (Üçgen vari) */
        .renk-1 { background: #3b82f6; color: white;} /* Mavi (Elmas vari) */
        .renk-2 { background: #eab308; color: white;} /* Sarı (Daire vari) */
        .renk-3 { background: #22c55e; color: white;} /* Yeşil (Kare vari) */
        
        /* LİDERLİK TABLOSU EKRANI */
        .liderlik-kutusu { background: white; color: #111827; padding: 30px; border-radius: 12px;}
        .liderlik-kutusu h2 { margin-top: 0;}
        .dogru-cevap-bilgisi { background: #dcfce7; color: #166534; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: 800; font-size: 18px;}
        .liste { list-style: none; padding: 0; margin: 0; text-align: left;}
        .liste li { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; font-weight: 600; font-size: 18px;}
        .liste li:nth-child(1) { background: #fef08a; font-weight: 800; font-size: 24px; border-radius: 8px;}
    </style>
</head>
<body>

    <!-- 1. GİRİŞ EKRANI -->
    <div id="girisEkrani" class="ekran aktif">
        <div class="giris-kutusu">
            <h1 style="margin-top: 0;">🎮 Bilgi Yarışması</h1>
            <p>Hızlı bilen daha çok puan kazanır!</p>
            <input type="text" id="isimInput" placeholder="Kullanıcı Adınız">
            <button onclick="oyunaKatil()">Oyuna Katıl</button>
        </div>
    </div>

    <!-- 2. BEKLEME EKRANI -->
    <div id="beklemeEkrani" class="ekran">
        <h2>⏳ Sonraki Soru Bekleniyor...</h2>
        <p>Sunucu diğer oyuncuları bekliyor veya şu an molada.</p>
    </div>

    <!-- 3. SORU EKRANI -->
    <div id="soruEkrani" class="ekran">
        <div class="sure-cubugu">
            <div id="sureIci" class="sure-ici"></div>
        </div>
        <div id="soruMetni" class="soru-metni">Soru Yükleniyor...</div>
        <div id="seceneklerAlani" class="secenekler">
            <!-- Butonlar JavaScript ile dinamik basılacak -->
        </div>
    </div>

    <!-- 4. LİDERLİK TABLOSU (SKOR) EKRANI -->
    <div id="skorEkrani" class="ekran">
        <div class="liderlik-kutusu">
            <h2>🏆 Puan Durumu</h2>
            <div id="dogruCevapBilgisi" class="dogru-cevap-bilgisi">Doğru Cevap: ...</div>
            <ul id="liderlikListesi" class="liste">
                <!-- Javascript ile basılacak -->
            </ul>
        </div>
    </div>

    <script>
        const wsProtocol = window.location.protocol === "https:" ? "wss" : "ws";
        const socket = new WebSocket(`${wsProtocol}://${window.location.host}/ws/yarisma`);
        
        // Ekran değiştirme motoru (Durum Makinesi UI kısmı)
        function ekranGoster(ekranId) {
            document.querySelectorAll('.ekran').forEach(e => e.classList.remove('aktif'));
            document.getElementById(ekranId).classList.add('aktif');
        }

        // 1. Oyuna girildiğinde
        function oyunaKatil() {
            const isim = document.getElementById('isimInput').value.trim();
            if(!isim) return;
            
            socket.send(JSON.stringify({tur: "giris", isim: isim}));
            ekranGoster("beklemeEkrani"); // Girer girmez bekleme ekranına al
        }

        // 2. SUNUCUDAN GELEN (ZAMANLANMIŞ) YAYINLARI DİNLEME
        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if (data.tur === "soru") {
                // SORU EKRANI GELDİ
                ekranGoster("soruEkrani");
                document.getElementById('soruMetni').innerText = data.soru;
                
                // Seçenek Butonlarını (A,B,C,D) Ekrana Çiz
                const seceneklerAlani = document.getElementById('seceneklerAlani');
                seceneklerAlani.innerHTML = "";
                data.secenekler.forEach((sec, index) => {
                    const btn = document.createElement('button');
                    btn.className = `secenek renk-${index}`;
                    btn.innerText = sec;
                    btn.onclick = () => cevapVer(sec, btn);
                    seceneklerAlani.appendChild(btn);
                });
                
                // 10 Saniyelik Progress Bar'ı Başlat (CSS Animasyonu)
                const sureIci = document.getElementById('sureIci');
                sureIci.style.width = "100%";
                sureIci.style.transition = "none";
                setTimeout(() => {
                    sureIci.style.transition = `width ${data.sure}s linear`;
                    sureIci.style.width = "0%";
                }, 50);
            }
            
            else if (data.tur === "skor") {
                // SKOR EKRANI GELDİ
                ekranGoster("skorEkrani");
                document.getElementById('dogruCevapBilgisi').innerText = `Doğru Cevap: ${data.dogru_cevap}`;
                
                // Liderlik Tablosunu Bas
                const liste = document.getElementById('liderlikListesi');
                liste.innerHTML = "";
                data.liderlik.forEach(kisi => {
                    liste.innerHTML += `<li><span>${kisi.isim}</span> <span>${kisi.puan} Puan</span></li>`;
                });
            }
            
            else if (data.tur === "bitis") {
                // YARIŞMA BİTTİ EKRANI
                ekranGoster("beklemeEkrani");
                document.querySelector('#beklemeEkrani h2').innerText = data.mesaj;
                document.querySelector('#beklemeEkrani p').innerText = "Kazananlar az önce ekranda gösterildi. Yeni yarışma yakında başlayacak.";
            }
        };

        // 3. Kullanıcı cevaba tıkladığında
        function cevapVer(secilenCevap, butonElementi) {
            socket.send(JSON.stringify({tur: "cevap", cevap: secilenCevap}));
            
            // Kullanıcı bir kere basınca diğer butonları pasifleştiriyoruz
            document.querySelectorAll('.secenek').forEach(btn => {
                btn.disabled = true;
                btn.style.opacity = "0.5";
            });
            
            // Sadece tıkladığı butonu belirgin bırakıyoruz ki anlasın
            butonElementi.style.opacity = "1";
            butonElementi.innerText += " (Seçildi)";
        }
    </script>
</body>
</html>

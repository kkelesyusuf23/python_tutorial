<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Canlı Müzayede Salonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #1f2937; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;}
        
        /* Şık Kutu Tasarımı */
        .tablo-kutusu { background: #111827; padding: 30px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.7); text-align: center; max-width: 450px; margin-top: 20px; border: 2px solid #374151;}
        .tablo-resmi { width: 100%; border-radius: 8px; margin-bottom: 25px;}
        
        /* Fiyat ve Lider Alanı */
        .fiyat-alani { background: #fcd535; color: #111; padding: 20px; border-radius: 8px; margin-bottom: 25px; transition: background 0.3s;}
        .guncel-fiyat { font-size: 42px; font-weight: 800; margin: 0; letter-spacing: -1px;}
        .lider { font-size: 18px; font-weight: 800; color: #b45309; margin-top: 5px;}
        
        /* Teklif Verme Kutusu */
        .teklif-alani { display: flex; gap: 10px; flex-direction: column;}
        .teklif-alani input { padding: 15px; border-radius: 8px; border: none; font-size: 18px; font-family: 'Outfit'; text-align: center; font-weight: 600; outline: none; background: #374151; color: white;}
        .teklif-alani button { background: #10b981; color: white; padding: 18px; border: none; border-radius: 8px; font-size: 22px; font-weight: 800; cursor: pointer; transition: 0.2s; font-family: 'Outfit';}
        .teklif-alani button:hover { background: #059669; transform: translateY(-2px);}
        
        #loglar { margin-top: 25px; font-size: 15px; color: #9ca3af; text-align: center; min-height: 40px; font-weight: 600;}
    </style>
</head>
<body>

    <h1 style="color: #fcd535;">🔨 Büyük Sanat Müzayedesi</h1>

    <div class="tablo-kutusu">
        <!-- Mona Lisa Tablosu -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg/400px-Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg" class="tablo-resmi">
        
        <div class="fiyat-alani">
            <div style="font-size: 15px; font-weight: 600; opacity: 0.8;">ŞU ANKİ TEKLİF</div>
            <div class="guncel-fiyat"><span id="guncelFiyat">10000</span> ₺</div>
            <div class="lider">Lider: <span id="liderIsim">Kimse</span></div>
        </div>

        <div class="teklif-alani">
            <input type="text" id="isimInput" placeholder="Adınız (Örn: Ali)">
            <button onclick="teklifVer()">+1.000 ₺ Teklif Ver</button>
        </div>
        
        <div id="loglar">Bağlanılıyor...</div>
    </div>

    <script>
        const wsProtocol = window.location.protocol === "https:" ? "wss" : "ws";
        const socket = new WebSocket(`${wsProtocol}://${window.location.host}/ws/teklif`);
        
        // Tarayıcının hafızasındaki o anki fiyat
        let anlikFiyat = 10000;

        // ==========================================
        // 1. WEBSOCKET BAĞLANDIĞINDA
        // ==========================================
        socket.onopen = () => {
            document.getElementById('loglar').innerText = "🟢 Odaya bağlanıldı. Teklif verebilirsiniz.";
            document.getElementById('loglar').style.color = "#10b981";
        };

        // ==========================================
        // 2. SUNUCUDAN BİRİSİNİN (YADA BİZİM) TEKLİFİMİZ GELDİĞİNDE
        // ==========================================
        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            // Eğer "Geçersiz!" (Kırmızı) uyarısı gelmediyse ekranı normal güncelle
            if(!data.mesaj.includes("❌")) {
                anlikFiyat = data.fiyat;
                document.getElementById('guncelFiyat').innerText = data.fiyat.toLocaleString();
                document.getElementById('liderIsim').innerText = data.isim;
                
                // Renk animasyonu (Fiyat değiştiğinde sarı ekran anlık beyaz parlasın)
                const fiyatAlani = document.querySelector('.fiyat-alani');
                fiyatAlani.style.background = "#fff";
                setTimeout(() => { fiyatAlani.style.background = "#fcd535"; }, 200);
                
                document.getElementById('loglar').style.color = "#fcd535";
            } else {
                // Eğer bizim teklifimiz Race Condition'a kurban gittiyse mesajı kırmızı yap
                document.getElementById('loglar').style.color = "#ef4444";
            }
            
            // Alt kısımdaki mesaj logunu ekrana bas
            document.getElementById('loglar').innerText = data.mesaj;
        };

        // ==========================================
        // 3. TEKLİF VER BUTONUNA BASILDIĞINDA
        // ==========================================
        function teklifVer() {
            const isim = document.getElementById('isimInput').value.trim();
            if(!isim) {
                alert("Lütfen teklif vermeden önce adınızı yazın!");
                return;
            }
            
            // Şu an ekranda gördüğümüz fiyatın üstüne 1000 TL ekleyip sunucuya "Ben bu fiyata alıyorum" diyoruz
            const yeniTeklif = anlikFiyat + 1000;
            
            socket.send(JSON.stringify({
                isim: isim,
                teklif: yeniTeklif
            }));
        }
    </script>
</body>
</html>

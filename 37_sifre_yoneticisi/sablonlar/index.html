<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>E2EE Şifre Kasası</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding-top: 50px; }
        
        .kasa { background: #1e293b; padding: 40px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); width: 400px; border: 1px solid #3b82f6; }
        
        h2 { text-align: center; color: #60a5fa; margin-top: 0; }
        p.bilgi { font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 30px; }
        
        .form-grup { margin-bottom: 20px; }
        label { font-size: 14px; color: #cbd5e1; font-weight: 600; display: block; margin-bottom: 5px; }
        input { width: 100%; box-sizing: border-box; padding: 12px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 8px; font-family: 'Outfit', sans-serif; }
        input:focus { outline: none; border-color: #3b82f6; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 800; font-size: 15px; cursor: pointer; transition: 0.2s; font-family: 'Outfit', sans-serif; margin-bottom: 10px; }
        .btn-ekle { background: #3b82f6; color: white; }
        .btn-ekle:hover { background: #2563eb; }
        .btn-coz { background: #10b981; color: white; }
        .btn-coz:hover { background: #059669; }
        
        .mesaj { padding: 15px; border-radius: 8px; background: #334155; text-align: center; font-weight: 600; margin-bottom: 20px; font-size: 14px; }
        
        .sifre-listesi { margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #475569; }
        .sifre-item { border-bottom: 1px solid #334155; padding: 10px 0; display: flex; justify-content: space-between; }
        .sifre-item:last-child { border-bottom: none; }
        .platform-ad { font-weight: 800; color: #3b82f6; }
        .gizli-sifre { color: #f8fafc; font-family: monospace; font-size: 15px; }
    </style>
</head>
<body>

    <div class="kasa">
        <h2>🛡️ E2EE Şifre Kasası</h2>
        <p class="bilgi">Sıfır Bilgi Mimarisi (Zero-Knowledge). Parolalarınız şifrelenerek saklanır. Biz bile göremeyiz.</p>
        
        {% if mesaj %}
            <div class="mesaj">{{ mesaj }}</div>
        {% endif %}

        <!-- ŞİFRE EKLEME FORMU -->
        <form action="/ekle" method="POST" style="padding-bottom: 20px; border-bottom: 1px solid #334155; margin-bottom: 20px;">
            <div class="form-grup">
                <label>Ana Şifreniz (Veritabanı Kilidi)</label>
                <input type="password" name="ana_sifre" required placeholder="Örn: master123">
            </div>
            <div style="display:flex; gap:10px;">
                <div class="form-grup" style="flex:1;">
                    <label>Platform</label>
                    <input type="text" name="platform" required placeholder="Örn: Netflix">
                </div>
                <div class="form-grup" style="flex:1;">
                    <label>Şifre</label>
                    <input type="text" name="gizli_sifre" required placeholder="Örn: 123456">
                </div>
            </div>
            <button type="submit" class="btn btn-ekle">🔐 Şifrele ve Kilitli Kutuya At</button>
        </form>
        
        
        <!-- ŞİFRE ÇÖZME FORMU -->
        <form action="/coz" method="POST">
            <div class="form-grup">
                <label>Kilitli Kasayı Açmak İçin Ana Şifreniz</label>
                <input type="password" name="ana_sifre" required placeholder="Ana şifreyi yanlış girerseniz kasa açılmaz!">
            </div>
            <button type="submit" class="btn btn-coz">🔓 Kilitleri Kır ve Şifreleri Getir</button>
        </form>
        
        <!-- ÇÖZÜLMÜŞ ŞİFRELER LİSTESİ -->
        {% if cozulmusler %}
            <div class="sifre-listesi">
                {% for platform, sifre in cozulmusler.items() %}
                    <div class="sifre-item">
                        <span class="platform-ad">{{ platform }}</span>
                        <span class="gizli-sifre">{{ sifre }}</span>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dosya Yükleme Merkezi</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .upload-container {
            background-color: #2a2a40;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #4ade80;
        }
        /* Dosya Yükleme Formu Stilleri */
        .file-input-wrapper {
            margin: 20px 0;
            padding: 20px;
            border: 2px dashed #4b5563;
            border-radius: 8px;
            background-color: #1f2937;
        }
        input[type="file"] {
            color: #9ca3af;
        }
        button {
            background-color: #4ade80;
            color: #111827;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        button:hover {
            background-color: #22c55e;
        }
    </style>
</head>
<body>

    <div class="upload-container">
        <h2>🚀 Dosya Yükleme Merkezi</h2>
        <p style="color: #9ca3af; font-size: 14px;">Lütfen sunucuya göndermek istediğiniz bir resim seçin.</p>
        
        <!-- 
            KRİTİK NOKTA: Dosya yükleyebilmek için formun methodu kesinlikle POST olmalıdır.
            Ve enctype="multipart/form-data" KESİNLİKLE yazılmalıdır.
            Aksi halde dosya sunucuya byte olarak gönderilemez, sadece dosyanın adı metin olarak gider.
        -->
        <form action="/yukle" method="POST" enctype="multipart/form-data">
            <div class="file-input-wrapper">
                <input type="file" name="dosya" accept="image/png, image/jpeg" required>
            </div>
            <button type="submit">Sunucuya Yükle</button>
        </form>

    </div>

</body>
</html>

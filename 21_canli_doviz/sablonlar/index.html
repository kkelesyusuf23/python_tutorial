<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Canlı Borsa & Döviz Tahtası</title>
    <!-- Modern Yazı Tipi -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #0b0f19; color: white; margin: 0; padding: 40px; }
        .kutu { background: #151e2d; padding: 40px; border-radius: 15px; max-width: 900px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h1 { color: #fcd535; text-align: center; margin-top: 0; border-bottom: 2px solid #2d3748; padding-bottom: 20px;}
        
        .tahta { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 30px;}
        .kart { background: #1e293b; padding: 25px 20px; border-radius: 12px; text-align: center; transition: background-color 0.3s; border: 1px solid #334155;}
        .sembol { font-size: 22px; font-weight: 800; color: #94a3b8; margin-bottom: 12px; letter-spacing: 1px;}
        .fiyat { font-size: 38px; font-weight: 800;}
        
        /* 
           Flash Animasyonları:
           Kripto projemizdeki gibi fiyatın rengi sonsuza kadar değişmez, sadece saniyelik olarak 
           arka plan ışıldar ve kaybolur (Profesyonel Borsa Hissi) 
        */
        .artiyor { animation: flashYesil 0.6s ease-out; color: #10b981; }
        .azaliyor { animation: flashKirmizi 0.6s ease-out; color: #ef4444; }
        
        @keyframes flashYesil {
            0% { background-color: rgba(16, 185, 129, 0.25); text-shadow: 0 0 15px #10b981;}
            100% { background-color: transparent; text-shadow: none;}
        }
        @keyframes flashKirmizi {
            0% { background-color: rgba(239, 68, 68, 0.25); text-shadow: 0 0 15px #ef4444;}
            100% { background-color: transparent; text-shadow: none;}
        }
        
        #baglanti-durumu { text-align: center; margin-top: 30px; font-size: 15px; font-weight: 600; padding: 15px; border-radius: 8px; background: #0f172a;}
        .acik { color: #10b981; border: 1px solid #10b981;}
        .kapali { color: #ef4444; border: 1px solid #ef4444;}
    </style>
</head>
<body>
    <div class="kutu">
        <h1>⚡ Canlı Döviz ve Emtia Tahtası</h1>
        
        <!-- Fiyatların Çizildiği Kartlar -->
        <div class="tahta">
            <!-- Python'dan (Jinja) ilk yüklemedeki fiyatları basıyoruz -->
            {% for sembol, fiyat in dovizler.items() %}
            <div class="kart" id="kart-{{ sembol|replace('/', '') }}">
                <div class="sembol">{{ sembol }}</div>
                <!-- İd kısmındaki özel karakterleri (/) JavaScript sorunsuz okusun diye siliyoruz (Örn: USD/TRY -> USDTRY) -->
                <div class="fiyat" id="fiyat-{{ sembol|replace('/', '') }}">₺{{ "%.2f"|format(fiyat) }}</div>
            </div>
            {% endfor %}
        </div>
        
        <div id="baglanti-durumu">📡 Sunucuya bağlanılıyor (WebSocket)...</div>
    </div>

    <script>
        // Sayfada sakladığımız eski fiyatlar sözlüğü (Karşılaştırma yapmak için)
        const eskiFiyatlar = {};
        {% for sembol, fiyat in dovizler.items() %}
            eskiFiyatlar["{{ sembol|replace('/', '') }}"] = {{ fiyat }};
        {% endfor %}

        // ==========================================
        // 1. WEBSOCKET BAĞLANTISINI (TÜNELİ) BAŞLAT
        // ==========================================
        // HTTP yerine WS protokolünü kullanıyoruz.
        const wsProtocol = window.location.protocol === "https:" ? "wss" : "ws";
        const socket = new WebSocket(`${wsProtocol}://${window.location.host}/ws/doviz`);
        const durumMetni = document.getElementById('baglanti-durumu');

        // ==========================================
        // 2. TÜNEL AÇILDIĞINDA TETİKLENİR
        // ==========================================
        socket.onopen = function(event) {
            durumMetni.innerText = "🟢 Gerçek Zamanlı Bağlantı Kuruldu (Push Engine Aktif)";
            durumMetni.className = "acik";
        };

        // ==========================================
        // 3. SUNUCUDAN VERİ İTİLDİĞİNDE (PUSH) TETİKLENİR
        // DİKKAT: Burada fetch() veya setInterval() yoktur. Sunucu ne zaman gönderirse anında burası tetiklenir!
        // ==========================================
        socket.onmessage = function(event) {
            // Sunucudan gelen String JSON'ı Javascript Objesine çevir
            const gelenVeri = JSON.parse(event.data); 
            
            for (let [sembol, yeniFiyat] of Object.entries(gelenVeri)) {
                // Python'dan gelen sembollerde "/" varsa sil (USD/TRY -> USDTRY)
                sembol = sembol.replace('/', '');
                
                const fiyatElementi = document.getElementById(`fiyat-${sembol}`);
                if (fiyatElementi) {
                    const eskiFiyat = eskiFiyatlar[sembol];
                    
                    // Sadece fiyat DEĞİŞTİYSE animasyonları oynat (Gereksiz render'ı engelle)
                    if (yeniFiyat !== eskiFiyat) {
                        fiyatElementi.innerText = `₺${yeniFiyat.toFixed(2)}`;
                        
                        // Önceki yanıp sönme class'larını temizle
                        fiyatElementi.classList.remove('artiyor', 'azaliyor');
                        
                        // Tarayıcının class değişimini yakalayıp animasyonu baştan tetiklemesi için küçük bir Hack
                        void fiyatElementi.offsetWidth; 
                        
                        // Artış - Azalış Karşılaştırması
                        if (yeniFiyat > eskiFiyat) {
                            fiyatElementi.classList.add('artiyor');
                        } else {
                            fiyatElementi.classList.add('azaliyor');
                        }
                        
                        // Yeni fiyatı hafızaya al
                        eskiFiyatlar[sembol] = yeniFiyat;
                    }
                }
            }
        };

        // ==========================================
        // 4. BAĞLANTI KOPTUĞUNDA
        // ==========================================
        socket.onclose = function(event) {
            durumMetni.innerText = "🔴 Bağlantı Koptu. Yeniden deneniyor...";
            durumMetni.className = "kapali";
        };
    </script>
</body>
</html>

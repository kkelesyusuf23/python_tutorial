<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güvenlik Doğrulama</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: {{ renk }}; color: white; text-align: center; }
        .ekran { background: rgba(0,0,0,0.2); padding: 50px; border-radius: 30px; backdrop-filter: blur(10px); max-width: 500px; }
        h1 { font-size: 36px; margin: 0 0 20px 0; }
        p { font-size: 20px; line-height: 1.5; margin: 0 0 30px 0; }
        .id-kutu { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; font-family: monospace; font-size: 14px; }
    </style>
</head>
<body>

    <div class="ekran">
        <h1>{{ mesaj }}</h1>
        <p>{{ durum }}</p>
        <div class="id-kutu">Taranan ID: <br> {{ bilet_id }}</div>
    </div>

</body>
</html>

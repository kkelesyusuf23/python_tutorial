<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biletiniz</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .bilet { background: white; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); width: 350px; overflow: hidden; text-align: center; }
        .ust-kisim { background: #0f172a; color: white; padding: 30px; }
        .ust-kisim h2 { margin: 0; font-size: 28px; color: #3b82f6; }
        .ust-kisim p { margin: 5px 0 0 0; color: #94a3b8; }
        .alt-kisim { padding: 30px; }
        img.qr { width: 250px; height: 250px; border-radius: 10px; border: 2px solid #e2e8f0; margin-bottom: 20px; }
        .uuid { font-family: monospace; color: #64748b; font-size: 12px; background: #f1f5f9; padding: 10px; border-radius: 8px; word-break: break-all; }
        .btn-test { display: inline-block; margin-top: 20px; padding: 12px 25px; background: #10b981; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; transition: 0.2s; }
        .btn-test:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="bilet">
        <div class="ust-kisim">
            <h2>Python VIP Konseri</h2>
            <p>Sıra: 14 | Koltuk: 42</p>
        </div>
        <div class="alt-kisim">
            <!-- FastAPI'den gelen Base64 Resim Doğrudan Ekrana Basılır -->
            <img class="qr" src="{{ qr_kod }}" alt="Bilet QR Kodu">
            
            <p style="font-weight: bold; color: #0f172a; margin-top:0;">Girişte Bu Kodu Okutun</p>
            <div class="uuid">Bilet ID: {{ bilet_id }}</div>
            
            <!-- Müşterinin güvenlik cihazını simüle edebilmesi için hızlı bir test butonu -->
            <a href="/dogrula/{{ bilet_id }}" target="_blank" class="btn-test">📸 (Güvenlik) Kodu Okut</a>
        </div>
    </div>

</body>
</html>
